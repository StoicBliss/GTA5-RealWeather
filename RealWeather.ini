[SETTINGS]
; 1 = Enable mod automatically when the game loads, 0 = Disabled until hotkey pressed
ENABLED_ON_STARTUP = 1

; 1 = Write detailed diagnostic messages to RealWeather.log, 0 = Disable logging
DEBUG = 1

; 1 = Display notification when weather changes, 0 = Silent transitions
NOTIFY_WHEN_SET_WEATHER = 1

; Notification presentation style:
; 1 = Modern Sleek Ticker (Clean 2-line HUD ticker above radar with local time & temp)
; 2 = Picture Card Alert (Customizable in [PICTURE_CARD] section below)
; 3 = Compact Single-Line Ticker
; 4 = Subtitle Banner (Bottom center of screen)
NOTIFICATION_STYLE = 2

; Compatibility behavior when the minimap / radar is hidden (e.g. by Minimap Control mod or game settings):
; 1 = Subtitle Fallback (Recommended): Automatically displays weather alert as an on-screen subtitle banner so the minimap stays clean and hidden
; 2 = Minimap Peek: Temporarily unhides the minimap & radar feed for 4 seconds so the full picture card / ticker feed appears, then restores hidden state
; 0 = Silent / Do Nothing: Disables weather notifications when minimap is hidden
MINIMAP_HIDDEN_BEHAVIOR = 1

; 1 = Synchronize in-game clock with the real local time of the selected location (1:1 real-time flow)
; 0 = In-game clock runs at normal GTA V speed
SYNC_REAL_TIME = 1

; 1 = Pause weather overrides during story missions, cutscenes, and scripted events
; 0 = Force real weather at all times, even during missions
RESPECT_GAME_MISSIONS = 1

; 1 = Pause real-time clock sync during story missions (in-game clock reverts to default 30x GTA speed during missions)
; 0 = Keep real-time 1:1 clock sync active at all times, even during missions and activities (Recommended)
RESPECT_MISSIONS_CLOCK = 0

; Time format for notifications and HUD:
; 12 = 12-Hour format with AM/PM (e.g. 11:05 AM)
; 24 = 24-Hour format (e.g. 23:05)
TIME_FORMAT = 12

; The real-world location to sync weather from (Format: City, CountryCode or City, State, Country)
; Example: Dhaka, BD or Los Angeles, CA or London, UK or Tokyo, JP
LOCATION = Los Angeles, CA

; Optional OpenWeatherMap API key (from https://home.openweathermap.org/api_keys)
; NOTE: If left BLANK, the mod automatically uses Open-Meteo for free zero-key weather!
API_KEY = 

; Weather service provider:
; Auto = Uses OpenWeatherMap if API_KEY is provided; otherwise seamlessly uses Open-Meteo (zero key required)
; OpenMeteo = Always use Open-Meteo (100% free, no API key needed)
; OpenWeatherMap = Always use OpenWeatherMap (requires valid API_KEY)
PROVIDER = Auto

; Interval in seconds between weather checks from the internet (Minimum: 15)
UPDATE_INTERVAL_SECONDS = 300

; Duration in seconds for smooth weather transition (clouds, lighting, rain fade-in)
TRANSITION_DURATION = 15.0

; Temperature display unit in notifications: C (Celsius) or F (Fahrenheit)
TEMPERATURE_UNIT = C

; Play a subtle GTA audio cue when hotkey is pressed or weather changes
PLAY_AUDIO_CUE = 1

[PICTURE_CARD]
; Active when NOTIFICATION_STYLE = 2 (Picture Card Alert)
; Contact picture icon to display on the card:
; Verified Native Options:
;   CHAR_BLIMP            = Atomic Blimp airship (Default)
;   CHAR_LS_TOURIST_BOARD = Los Santos Tourist Board official city seal
;   CHAR_LIFEINVADER      = Lifeinvader media badge
;   CHAR_SOCIAL_CLUB      = Rockstar Social Club logo
;   CHAR_CALL911          = Emergency Services 911 shield badge
;   CHAR_DEFAULT          = Clean GTA V contact silhouette portrait
CARD_ICON = CHAR_BLIMP

; Header title (Sender text at top of the card)
CARD_SENDER = Los Santos Weather

; Subtitle (Subject text under sender). Supports {LOCATION}, {TEMP}, {TIME}, {CONDITION}
CARD_SUBTITLE = {LOCATION}

; Location naming mode:
; Lore = Shows fictional GTA lore-friendly name (e.g. Los Santos, SA)
; Real = Shows the real-world resolved location (e.g. Dhaka, BD or London, UK)
LOCATION_DISPLAY_MODE = Lore

; Custom lore-friendly location name when LOCATION_DISPLAY_MODE = Lore
; Examples: Los Santos, SA | Blaine County, SA | San Andreas | Paleto Bay, SA
LORE_LOCATION_NAME = Los Santos, SA

; Information rows to show on the card body (1 = Show, 0 = Hide)
SHOW_TIME = 1
SHOW_CONDITION = 1
SHOW_TEMPERATURE = 1

; 1 = Flashing alert banner & pulsing animpostfx for breaking weather broadcasts, 0 = Standard quiet card
FLASH_ALERT = 1

[KEYS]
; Mod modifier hold key. Options:
;   RShift = Right Shift (Recommended - no conflict with sprinting)
;   LShift = Left Shift
;   Shift  = Either Shift (Left or Right Shift)
;   RCtrl  = Right Control
;   LCtrl  = Left Control
;   Ctrl   = Either Control
;   None   = No modifier key required (press keys directly)
; Virtual key hex codes are also supported: 0xA1 = RShift, 0xA0 = LShift, 0x10 = Shift, 0xA3 = RCtrl
HOLD_KEY = RShift

; Toggle mod on/off shortcut: HOLD_KEY + PRESS_KEY (Default: HOLD_KEY + W)
; Plain letters (e.g. W) and hex codes (e.g. 0x57) are both supported!
PRESS_KEY = 0x57

; Toggle Real Time clock sync on/off shortcut: HOLD_KEY + TIME_KEY (Default: HOLD_KEY + T)
; Plain letters (e.g. T) and hex codes (e.g. 0x54) are both supported!
TIME_KEY = 0x54

; Preview notification card alert shortcut: HOLD_KEY + PREVIEW_KEY (Default: HOLD_KEY + O)
; Press this in-game anytime to immediately test and preview your customized card!
; Both 'O' (0x4F) and 'P' (0x50) are supported out of the box!
PREVIEW_KEY = 0x4F
